<!DOCTYPE html>
<html lang="he" dir="rtl" style="height:100%; margin:0; padding:0;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guard Onboarding</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: auto;           /* מאפשר גלילה אם צריך */
      background: #0f172a;      /* רקע כהה למניעת מסגרת לבנה */
    }

    iframe {
      position: absolute;       /* במקום fixed – נמנע בעיות גובה */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;      /* רקע לבן כמו תוכן הדף */
      overflow-y: auto;         /* גלילה פנימית */
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbx5emxKmxRjlnRdxFnr4NsaHdki5iyYL5H66aURyxOugcmNDlx6aksLq4VKjMg_aZJTOQ/exec"
    scrolling="yes"
    allow="fullscreen; autoplay"
    title="Guard Onboarding">
  </iframe>
</body>
</html>
