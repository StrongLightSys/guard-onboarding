<!DOCTYPE html>
<html lang="he" dir="rtl" style="height:100%; margin:0; padding:0;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guard Onboarding</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a; /* רקע כהה – מונע מסגרת לבנה */
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* גובה דינמי – פותר חיתוך בנייד */
      border: none;
      display: block;
      background: #ffffff; /* רקע לבן כמו הדף הפנימי – מונע פס לבן */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body style="height:100%; margin:0;">
  <iframe
    src="https://script.google.com/macros/s/AKfycbx5emxKmxRjlnRdxFnr4NsaHdki5iyYL5H66aURyxOugcmNDlx6aksLq4VKjMg_aZJTOQ/exec"
    allow="fullscreen"
    title="Guard Onboarding">
  </iframe>
</body>
</html>
